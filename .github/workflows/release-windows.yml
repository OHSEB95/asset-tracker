name: Release Windows build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - run: npm ci

      # GitHub Releases에는 동일 버전이 이미 있으면 게시가 안 되므로, 매 빌드마다
      # 실행 번호를 붙여 patch 버전을 유일하게 만든다(package.json 자체는 커밋하지 않음).
      - name: Bump build version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # releaseType: release(즉시 공개)로 발행하려면 GitHub가 해당 태그가 이미 존재하기를
      # 요구해서, 빌드 전에 미리 태그를 만들어 push해둔다.
      - name: Create release tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # electron-builder의 --publish always는 exe/blockmap을 병렬로 올리면서 같은 태그에
      # 릴리즈를 두 개 만들어버리는 경우가 있어(레이스 컨디션), 여기서는 로컬 빌드만 하고
      # 업로드는 gh release create로 한 번에 처리한다.
      - name: Build (no publish)
        shell: bash
        run: npx electron-vite build && npx electron-builder --win --publish never
        env:
          MAIN_VITE_FIREBASE_API_KEY: ${{ secrets.MAIN_VITE_FIREBASE_API_KEY }}
          MAIN_VITE_FIREBASE_PROJECT_ID: ${{ secrets.MAIN_VITE_FIREBASE_PROJECT_ID }}

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            "dist/AssetTracker-Setup-$VERSION.exe" \
            "dist/AssetTracker-Setup-$VERSION.exe.blockmap" \
            "dist/latest.yml" \
            --title "v$VERSION" \
            --notes "자동 빌드"
